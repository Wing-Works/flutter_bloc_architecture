name: domain
description: "Domain layer is high level module and package for flutter_bloc_architecture (defines entities, use-cases, and repositories interfaces)."
version: 0.0.1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.10.4
  flutter: ">=1.17.0"

dependencies:

  dartz:
    git:
      url: https://github.com/rahul-gola/dartz.git

  flutter:
    sdk: flutter

  get_it: ^9.2.0
  injectable: ^2.7.1+2
  json_annotation: ^4.9.0

dev_dependencies:

  build_runner: 2.10.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  injectable_generator: 2.11.1
  json_serializable: 6.11.3
  mockito: ^5.5.1

flutter:

  uses-material-design: true