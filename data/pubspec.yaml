name: data
description: "Data layer package for flutter_bloc_architecture (provides repositories, models, and remote/local data sources)."
version: 0.0.1
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
resolution: workspace

environment:
  sdk: ^3.11.5
  flutter: ">=1.17.0"

dependencies:
  dio: ^5.9.2
  domain: any

  flutter:
    sdk: flutter

  get_it: any
  injectable: any
  json_annotation: ^4.12.0
  pretty_dio_logger: ^1.4.0
  retrofit: 4.9.2
  shared_preferences: ^2.5.5
  twofold: any

dev_dependencies:
  build_runner: any
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

  injectable_generator: any
  json_serializable: ^6.14.0
  retrofit_generator: 10.2.6
